# 部署 Web PWA 到 GitHub Pages（手机端“桌面版本”即走此路径，无需 Apple 开发者账号）
# 触发：push 到 main 分支，或 Actions 页面手动 Run workflow
# 前置：仓库 Settings → Secrets → Actions 新增
#       EXPO_PUBLIC_SUPABASE_URL   = https://xyufbgmhjmqdanrblvit.supabase.co
#       EXPO_PUBLIC_SUPABASE_ANON_KEY = 项目 anon key（见 .env.local）
# 说明：Expo 会把 EXPO_PUBLIC_* 在构建时内联进网页；anon key 本就可公开（随 App 包发布）。
#       若用「项目页」(username.github.io/repo) 部署，请在 app.json 的 web.basePath 设为 "/repo/"，
#       或用「用户页」(username.github.io) / 自定义域名 / Netlify / Cloudflare Pages 免去 basePath 处理。
name: Deploy Web PWA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web bundle
        run: pnpm build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
