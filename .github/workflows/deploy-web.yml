# 部署 Web PWA 到 GitHub Pages（手机端“桌面版本”即走此路径，无需 Apple 开发者账号）
# 触发：push 到 main 分支，或 Actions 页面手动 Run workflow
#
# 前置（仓库 Settings → Secrets → Actions 新增两个变量）：
#   EXPO_PUBLIC_SUPABASE_URL    = https://xyufbgmhjmqdanrblvit.supabase.co
#   EXPO_PUBLIC_SUPABASE_ANON_KEY = 项目 anon key（见 .env.local）
# 说明：Expo 在构建时会把 EXPO_PUBLIC_* 内联进网页；anon key 本就可公开（随 App 包发布）。
#
# 关于子路径（base path）：
#   - 用户页 / 组织页（仓库名为 <owner>.github.io）：站点在根路径 "/"，无需 base path。
#   - 项目页（仓库名为 <owner>.github.io/<repo>）：站点在 "/<repo>/" 子路径下。
#     Expo SDK 52 的静态导出通过 app.json 的 experiments.baseUrl 控制资源前缀，
#     本工作流在构建前自动注入该值（用户页留空、项目页填 "/<repo>"）。
#   - 另：GitHub Pages 默认跑 Jekyll，会丢弃以下划线开头的 _expo 目录，
#     因此构建后写入 dist/.nojekyll 关闭 Jekyll 处理。
name: Deploy Web PWA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 不写死 version：自动读取 package.json 的 packageManager（pnpm@10.28.2，与 lockfile 一致）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile

      - name: Build web bundle
        run: pnpm build:web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # 关闭 Jekyll，避免 _expo 等资源目录被忽略
      - name: 写入 .nojekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
