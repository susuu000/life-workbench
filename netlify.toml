# Netlify 部署配置（零 basePath 处理，连仓库即上线）
# 用法：Netlify 导入本仓库 → Build & deploy 自动读取本文件；
#       在 Site settings → Environment variables 添加：
#         EXPO_PUBLIC_SUPABASE_URL        = https://xyufbgmhjmqdanrblvit.supabase.co
#         EXPO_PUBLIC_SUPABASE_ANON_KEY   = 项目 anon key（见 .env.local）
[build]
  # Netlify 根路径部署：构建前去掉 app.json 中的 experiments.baseUrl（GitHub Pages 项目页需要它，Netlify 不需要）
  command = "node -e \"const fs=require('fs'),j=JSON.parse(fs.readFileSync('app.json','utf8'));delete j.expo.experiments?.baseUrl;fs.writeFileSync('app.json',JSON.stringify(j,null,2)+'\\n')\" && pnpm build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA 兜底：未知路径回退到 index.html（expo-router 已静态导出各路由 .html）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
