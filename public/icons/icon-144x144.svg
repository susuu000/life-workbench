<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.25" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="1.125" y="1.125" width="141.75" height="141.75" rx="25.3125" fill="url(#bg)"/>

  <!-- 月亮 -->
  <g filter="url(#glow)" transform="translate(72, 61.875)">
    <circle cx="0" cy="0" r="28.125" fill="url(#moon)" opacity="0.9"/>
    <!-- 月牙缺口 -->
    <circle cx="9.84375" cy="-7.03125" r="21.09375" fill="url(#bg)"/>
  </g>

  <!-- 星星 -->
  <g fill="#8b5cf6" opacity="0.6">
    <circle cx="45" cy="92.8125" r="1.125"/>
    <circle cx="98.4375" cy="84.375" r="0.84375"/>
    <circle cx="36.5625" cy="106.875" r="0.703125"/>
    <circle cx="106.875" cy="104.0625" r="0.5625"/>
    <circle cx="56.25" cy="112.5" r="0.5625"/>
    <circle cx="90" cy="118.125" r="0.421875"/>
  </g>

  <!-- 文字：夕 -->
  <text x="72" y="122.34375" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="15.75" font-weight="300"
        fill="#3d3226" opacity="0.7">夕</text>
</svg>