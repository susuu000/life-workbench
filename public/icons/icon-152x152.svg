<svg xmlns="http://www.w3.org/2000/svg" width="152" height="152" viewBox="0 0 152 152">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.375" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="1.1875" y="1.1875" width="149.625" height="149.625" rx="26.71875" fill="url(#bg)"/>

  <!-- 月亮 -->
  <g filter="url(#glow)" transform="translate(76, 65.3125)">
    <circle cx="0" cy="0" r="29.6875" fill="url(#moon)" opacity="0.9"/>
    <!-- 月牙缺口 -->
    <circle cx="10.390625" cy="-7.421875" r="22.265625" fill="url(#bg)"/>
  </g>

  <!-- 星星 -->
  <g fill="#8b5cf6" opacity="0.6">
    <circle cx="47.5" cy="97.96875" r="1.1875"/>
    <circle cx="103.90625" cy="89.0625" r="0.890625"/>
    <circle cx="38.59375" cy="112.8125" r="0.7421875"/>
    <circle cx="112.8125" cy="109.84375" r="0.59375"/>
    <circle cx="59.375" cy="118.75" r="0.59375"/>
    <circle cx="95" cy="124.6875" r="0.4453125"/>
  </g>

  <!-- 文字：夕 -->
  <text x="76" y="129.140625" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="16.625" font-weight="300"
        fill="#3d3226" opacity="0.7">夕</text>
</svg>