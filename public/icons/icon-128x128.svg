<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="1" y="1" width="126" height="126" rx="22.5" fill="url(#bg)"/>

  <!-- 月亮 -->
  <g filter="url(#glow)" transform="translate(64, 55)">
    <circle cx="0" cy="0" r="25" fill="url(#moon)" opacity="0.9"/>
    <!-- 月牙缺口 -->
    <circle cx="8.75" cy="-6.25" r="18.75" fill="url(#bg)"/>
  </g>

  <!-- 星星 -->
  <g fill="#8b5cf6" opacity="0.6">
    <circle cx="40" cy="82.5" r="1"/>
    <circle cx="87.5" cy="75" r="0.75"/>
    <circle cx="32.5" cy="95" r="0.625"/>
    <circle cx="95" cy="92.5" r="0.5"/>
    <circle cx="50" cy="100" r="0.5"/>
    <circle cx="80" cy="105" r="0.375"/>
  </g>

  <!-- 文字：夕 -->
  <text x="64" y="108.75" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="14" font-weight="300"
        fill="#3d3226" opacity="0.7">夕</text>
</svg>