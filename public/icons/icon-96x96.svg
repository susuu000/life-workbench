<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="0.75" y="0.75" width="94.5" height="94.5" rx="16.875" fill="url(#bg)"/>

  <!-- 月亮 -->
  <g filter="url(#glow)" transform="translate(48, 41.25)">
    <circle cx="0" cy="0" r="18.75" fill="url(#moon)" opacity="0.9"/>
    <!-- 月牙缺口 -->
    <circle cx="6.5625" cy="-4.6875" r="14.0625" fill="url(#bg)"/>
  </g>

  <!-- 星星 -->
  <g fill="#8b5cf6" opacity="0.6">
    <circle cx="30" cy="61.875" r="0.75"/>
    <circle cx="65.625" cy="56.25" r="0.5625"/>
    <circle cx="24.375" cy="71.25" r="0.46875"/>
    <circle cx="71.25" cy="69.375" r="0.375"/>
    <circle cx="37.5" cy="75" r="0.375"/>
    <circle cx="60" cy="78.75" r="0.28125"/>
  </g>

  <!-- 文字：夕 -->
  <text x="48" y="81.5625" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="10.5" font-weight="300"
        fill="#3d3226" opacity="0.7">夕</text>
</svg>