<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="4" y="4" width="504" height="504" rx="90" fill="url(#bg)"/>

  <!-- 月亮 -->
  <g filter="url(#glow)" transform="translate(256, 220)">
    <circle cx="0" cy="0" r="100" fill="url(#moon)" opacity="0.9"/>
    <!-- 月牙缺口 -->
    <circle cx="35" cy="-25" r="75" fill="url(#bg)"/>
  </g>

  <!-- 星星 -->
  <g fill="#8b5cf6" opacity="0.6">
    <circle cx="160" cy="330" r="4"/>
    <circle cx="350" cy="300" r="3"/>
    <circle cx="130" cy="380" r="2.5"/>
    <circle cx="380" cy="370" r="2"/>
    <circle cx="200" cy="400" r="2"/>
    <circle cx="320" cy="420" r="1.5"/>
  </g>

  <!-- 文字：夕 -->
  <text x="256" y="435" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="56" font-weight="300"
        fill="#3d3226" opacity="0.7">夕</text>
</svg>