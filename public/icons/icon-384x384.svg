<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="3" y="3" width="378" height="378" rx="67.5" fill="url(#bg)"/>

  <!-- 月亮 -->
  <g filter="url(#glow)" transform="translate(192, 165)">
    <circle cx="0" cy="0" r="75" fill="url(#moon)" opacity="0.9"/>
    <!-- 月牙缺口 -->
    <circle cx="26.25" cy="-18.75" r="56.25" fill="url(#bg)"/>
  </g>

  <!-- 星星 -->
  <g fill="#8b5cf6" opacity="0.6">
    <circle cx="120" cy="247.5" r="3"/>
    <circle cx="262.5" cy="225" r="2.25"/>
    <circle cx="97.5" cy="285" r="1.875"/>
    <circle cx="285" cy="277.5" r="1.5"/>
    <circle cx="150" cy="300" r="1.5"/>
    <circle cx="240" cy="315" r="1.125"/>
  </g>

  <!-- 文字：夕 -->
  <text x="192" y="326.25" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="42" font-weight="300"
        fill="#3d3226" opacity="0.7">夕</text>
</svg>