<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="0.25" y="0.25" width="31.5" height="31.5" rx="5.625" fill="url(#bg)"/>

  <!-- 月亮 -->
  <g filter="url(#glow)" transform="translate(16, 13.75)">
    <circle cx="0" cy="0" r="6.25" fill="url(#moon)" opacity="0.9"/>
    <!-- 月牙缺口 -->
    <circle cx="2.1875" cy="-1.5625" r="4.6875" fill="url(#bg)"/>
  </g>

  <!-- 星星 -->
  <g fill="#8b5cf6" opacity="0.6">
    <circle cx="10" cy="20.625" r="0.25"/>
    <circle cx="21.875" cy="18.75" r="0.1875"/>
    <circle cx="8.125" cy="23.75" r="0.15625"/>
    <circle cx="23.75" cy="23.125" r="0.125"/>
    <circle cx="12.5" cy="25" r="0.125"/>
    <circle cx="20" cy="26.25" r="0.09375"/>
  </g>

  <!-- 文字：夕 -->
  <text x="16" y="27.1875" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="3.5" font-weight="300"
        fill="#3d3226" opacity="0.7">夕</text>
</svg>