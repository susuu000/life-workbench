<svg xmlns="http://www.w3.org/2000/svg" width="1668" height="2388" viewBox="0 0 1668 2388">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1668" height="2388" fill="url(#bg)"/>

  <!-- 月亮 -->
  <g transform="translate(834, 1133.952)">
    <circle r="200.16" fill="url(#moon)" opacity="0.85"/>
    <circle cx="70.056" cy="-50.04" r="150.12" fill="url(#bg)"/>
  </g>

  <!-- 标题 -->
  <text x="834" y="1494.24" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="75" font-weight="300"
        fill="#3d3226" opacity="0.6">月夕 · 生活台</text>
</svg>