    <circle r="140.4" fill="url(#moon)" opacity="0.85"/>
    <circle cx="49.14" cy="-35.1" r="105.30000000000001" fill="url(#bg)"/>
  </g>

  <!-- 标题 -->
  <text x="585" y="1476.6" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="53" font-weight="300"
        fill="#3d3226" opacity="0.6">月夕 · 生活台</text>
