<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="750" height="1334" fill="url(#bg)"/>

  <!-- 月亮 -->
  <g transform="translate(375, 640)">
    <circle r="90" fill="url(#moon)" opacity="0.85"/>
    <circle cx="31.499999999999996" cy="-22.5" r="67.5" fill="url(#bg)"/>
  </g>

  <!-- 标题 -->
  <text x="375" y="802" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="34" font-weight="300"
        fill="#3d3226" opacity="0.6">月夕 · 生活台</text>
</svg>