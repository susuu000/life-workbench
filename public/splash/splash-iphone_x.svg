<svg xmlns="http://www.w3.org/2000/svg" width="1125" height="2436" viewBox="0 0 1125 2436">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#b8944f"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1125" height="2436" fill="url(#bg)"/>

  <!-- 月亮 -->
  <g transform="translate(562.5, 1177.5)">
    <circle r="135" fill="url(#moon)" opacity="0.85"/>
    <circle cx="47.25" cy="-33.75" r="101.25" fill="url(#bg)"/>
  </g>

  <!-- 标题 -->
  <text x="562.5" y="1420.5" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="51" font-weight="300"
        fill="#3d3226" opacity="0.6">月夕 · 生活台</text>
</svg>